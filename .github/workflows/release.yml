# Pushing a tag like v0.2.0 or v0.2.0-beta builds the zip, publishes a GitHub release and,
# when configured, uploads it to CurseForge. Tags with a suffix (-alpha, -beta) are
# pre-releases on GitHub and alpha/beta files on CurseForge.
#
# CurseForge setup (the upload is skipped until all three exist):
#   secret   CF_API_KEY        API token from authors.curseforge.com/account/api-tokens
#   variable CF_PROJECT_ID     numeric project ID shown on the CurseForge project page
#   variable CF_GAME_VERSIONS  comma-separated game version IDs (see curseforge-versions.yml)
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
      - run: uv sync
      - run: uv run pytest

      - name: Check the tag matches the addon version
        run: |
          version=$(sed -n 's/^## Version: *//p' RareCodex/RareCodex.toc | tr -d '\r')
          case "$GITHUB_REF_NAME" in
            "v$version"|"v$version"-*) ;;
            *) echo "Tag $GITHUB_REF_NAME does not match ## Version: $version"; exit 1 ;;
          esac

      - run: uv run python tools/package.py

      - name: Publish the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          prerelease=""
          case "$GITHUB_REF_NAME" in *-*) prerelease="--prerelease" ;; esac
          gh release create "$GITHUB_REF_NAME" dist/*.zip $prerelease \
            --title "RareCodex ${GITHUB_REF_NAME#v}" --generate-notes

      # Secrets cannot be tested in `if:`, so this step reports whether CurseForge is set up.
      # The token is only exposed to this step and the upload, never to third-party actions.
      - name: Check CurseForge configuration
        id: curseforge
        env:
          CF_API_KEY: ${{ secrets.CF_API_KEY }}
          CF_PROJECT_ID: ${{ vars.CF_PROJECT_ID }}
          CF_GAME_VERSIONS: ${{ vars.CF_GAME_VERSIONS }}
        run: |
          if [ -n "$CF_API_KEY" ] && [ -n "$CF_PROJECT_ID" ] && [ -n "$CF_GAME_VERSIONS" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "CurseForge is not configured; skipping the upload." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload to CurseForge
        if: steps.curseforge.outputs.configured == 'true'
        env:
          CF_API_KEY: ${{ secrets.CF_API_KEY }}
          CF_PROJECT_ID: ${{ vars.CF_PROJECT_ID }}
          CF_GAME_VERSIONS: ${{ vars.CF_GAME_VERSIONS }}
        run: |
          case "$GITHUB_REF_NAME" in
            *-alpha*) release_type=alpha ;;
            *-beta*) release_type=beta ;;
            *) release_type=release ;;
          esac
          release_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/releases/tag/$GITHUB_REF_NAME"
          metadata=$(jq -n \
            --arg name "RareCodex ${GITHUB_REF_NAME#v}" \
            --arg type "$release_type" \
            --arg versions "$CF_GAME_VERSIONS" \
            --arg changelog "Changes: $release_url" \
            '{displayName: $name, releaseType: $type, changelog: $changelog,
              changelogType: "markdown",
              gameVersions: ($versions | split(",") | map(gsub(" "; "") | tonumber))}')
          zip=$(ls dist/*.zip)
          curl --fail-with-body -sS \
            -H "X-Api-Token: $CF_API_KEY" \
            --form-string "metadata=$metadata" \
            -F "file=@$zip" \
            "https://wow.curseforge.com/api/projects/$CF_PROJECT_ID/upload-file"
