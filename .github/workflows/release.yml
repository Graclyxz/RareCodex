# Pushing a tag like v0.2.0 or v0.2.0-alpha builds the zip and publishes a GitHub release.
# Tags with a suffix (-alpha, -beta) are marked as pre-releases.
# TODO: upload to CurseForge once the project exists (needs its project ID and an API token).
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6.8.0
      - run: uv sync
      - run: uv run pytest

      - name: Check the tag matches the addon version
        run: |
          version=$(sed -n 's/^## Version: *//p' RareCodex/RareCodex.toc | tr -d '\r')
          case "$GITHUB_REF_NAME" in
            "v$version"|"v$version"-*) ;;
            *) echo "Tag $GITHUB_REF_NAME does not match ## Version: $version"; exit 1 ;;
          esac

      - run: uv run python tools/package.py

      - name: Publish the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          prerelease=""
          case "$GITHUB_REF_NAME" in *-*) prerelease="--prerelease" ;; esac
          gh release create "$GITHUB_REF_NAME" dist/*.zip $prerelease \
            --title "RareCodex ${GITHUB_REF_NAME#v}" --generate-notes
